
plugins {
    id "java"
    id "application"
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

application {
    mainClass = "Hello"
}

ext.versions = [
    "sdk": "[7.16.0,8.0.0)"
]

dependencies {
    implementation "com.launchdarkly:launchdarkly-java-server-sdk:${versions.sdk}"
}
